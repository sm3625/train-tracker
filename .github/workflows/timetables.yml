# Rebuilds the railroads' timetables every week, commits them when they change, and redeploys the feeds worker with
# its new copy:
#   data/timetables.json       the trip planner's timetables (Amtrak republishes weekly, covering about a week ahead)
#   worker/src/schedules.json  what the feeds worker matches live trains against. A railroad that changes its
#                              schedule while this copy is old has its trains shown grey, with no stops or times
#                              (NJ Transit's, October 2026), so it's rebuilt and redeployed on the same schedule.
# Needs repository secrets (Settings > Secrets and variables > Actions):
#   CALTRAIN_511_KEY                           Caltrain's timetable (from 511)
#   NJT_USERNAME, NJT_PASSWORD, NJT_HOST       NJ Transit's (each sign-in counts toward NJ's 10 a day; this uses two)
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   to deploy the worker: a token from the "Edit Cloudflare Workers"
#                                              template (dash.cloudflare.com > My Profile > API Tokens)
# A railroad that fails keeps its previous timetable, the rest are still committed and deployed, and the run is marked
# as failed. The worker is deployed only if its tests pass.
name: Refresh timetables

on:
  schedule:
    - cron: '23 10 * * 1'   # Mondays 10:23 UTC
  workflow_dispatch:         # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CALTRAIN_511_KEY: ${{ secrets.CALTRAIN_511_KEY }}
      NJT_USERNAME: ${{ secrets.NJT_USERNAME }}
      NJT_PASSWORD: ${{ secrets.NJT_PASSWORD }}
      NJT_HOST: ${{ secrets.NJT_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: worker
      - name: Build the trip planner's timetables
        id: planner
        continue-on-error: true   # a railroad that fails keeps its old timetable; commit the rest anyway
        run: node worker/build-timetables.mjs
      - name: Build the worker's timetables
        id: worker
        continue-on-error: true
        run: node worker/build-schedules.mjs
      - name: Test the worker with them
        run: npm test
        working-directory: worker
      - name: Commit if anything changed
        id: commit
        run: |
          git add data/timetables.json worker/src/schedules.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          if ! git diff --cached --quiet -- worker/src/schedules.json; then echo "worker=changed" >> "$GITHUB_OUTPUT"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh timetables"
          git push
      - name: Deploy the worker with its new timetables
        if: steps.commit.outputs.worker == 'changed'
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Flag a railroad that failed
        if: steps.planner.outcome == 'failure' || steps.worker.outcome == 'failure'
        run: echo "::error::Some timetables could not be refreshed. See the Build steps." && exit 1
